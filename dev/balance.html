<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バランス調整</title><link rel="stylesheet" href="balance.css"><main><h1>開発者用バランス調整</h1><p id="mode"></p><p>数値を入力し「変更を適用」で保存。同じオリジンの開発モードのゲームへ自動反映します。既存の所持金・在庫・仲間・確定済み明細は変更しません。表示は次の画面操作で更新されます。</p><p>初期資金は「最初から」で開始時、それ以外は次の仕入れ・販売・派遣帰還・精算・治療などの計算時に使用します。進行セーブは通常ゲームと共通です。調整後のプレイ結果も通常セーブへ保存されます。</p><p>未接続：成長・経験値・怪我発生・遠征成功率・攻略率。商品抽選は従来の一様抽選。正式な商品価格は未設定です。引取率＝引取基準額÷仮販売価格。</p><nav><a href="/index.html?dev=balance" target="_blank" rel="noopener">開発モードのゲームを開く ↗</a><button id="apply">変更を適用</button><button id="reset">デフォルトへ戻す</button><button id="export">JSON書き出し</button><label>JSON読み込み <input id="import" type="file" accept=".json,application/json"></label></nav><p id="status" role="status" aria-live="polite"></p><div id="fields"></div></main><script src="../js/balance.js"></script><script src="balance.js"></script></html>
