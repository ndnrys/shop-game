<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Shop Game｜画面設計モック</title>
<style>
/* Skin contract: override these tokens only; screen structure and behavior stay independent. */
:root{--bg:#eceeea;--paper:#fff;--ink:#27312f;--muted:#75807a;--line:#d9dfd9;--accent:#3c6559;--soft:#eff4f0;--radius:12px;--font:system-ui,sans-serif}
[data-skin=night]{--bg:#171f25;--paper:#222e35;--ink:#e6eceb;--muted:#9aadae;--line:#405058;--accent:#99c8bc;--soft:#2b3b40}
[data-skin=paper]{--bg:#e9dfcb;--paper:#faf4e7;--ink:#493c2c;--muted:#8c7961;--line:#d7c7ac;--accent:#796044;--soft:#eee4d1;--radius:3px;--font:serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px}button,select,input{font:inherit;color:inherit}button,select{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button.active{background:var(--soft);border-color:var(--accent)}.primary{background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:700}.shell{height:100dvh;max-width:500px;margin:auto;background:var(--paper);display:grid;grid-template-rows:26px 57px 1fr 57px;box-shadow:0 0 0 1px var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}.prototype{background:var(--soft);color:var(--muted);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:10px}.prototype button{padding:2px 7px;font-size:10px}header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}header strong{display:block;font-size:15px}small,.muted{color:var(--muted);font-size:11px}main{min-height:0;display:flex;flex-direction:column;padding:14px 16px 10px;gap:10px}h1{font-size:21px;margin:0}h2{font-size:14px;margin:0 0 8px}p{margin:0;line-height:1.65}nav{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);gap:1px;padding:5px}nav button{padding:4px 0;font-size:10px;border:0;background:transparent}nav button span{display:block;font-size:17px;margin-bottom:2px}.heading{display:flex;align-items:center;justify-content:space-between}.tag{font-size:10px;color:var(--accent);background:var(--soft);padding:4px 8px;border-radius:5px}.card{border:1px solid var(--line);border-radius:var(--radius);padding:13px;background:var(--paper)}.soft{background:var(--soft)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:9px}.grow{flex:1;min-height:0}.actions{display:flex;gap:8px}.actions>*{flex:1}.bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px}.ledger .row{padding:9px 0;border-bottom:1px solid var(--line)}.ledger .row:last-child{border-bottom:0;font-weight:700}.stat{font-size:27px;font-weight:650;letter-spacing:-1px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats .card{padding:10px}.stats strong{display:block;margin-top:6px}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.steps span{font-size:9px;text-align:center;border-top:3px solid var(--line);padding-top:6px;color:var(--muted)}.steps .current{color:var(--accent);border-color:var(--accent);font-weight:700}.hero-placeholder{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);background:var(--soft)}.merchant{display:grid;grid-template-columns:1fr auto;gap:6px}.counter{display:flex;align-items:center;gap:14px}.counter button{width:34px;padding:6px}.list{display:grid;gap:7px}.item{width:100%;display:flex;align-items:center;justify-content:space-between;padding:11px;text-align:left}.item b{font-size:12px}.symbol{display:inline-grid;place-items:center;width:33px;height:33px;border:1px solid var(--line);border-radius:7px;font-size:17px;margin-right:8px}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-width:280px;width:100%;margin:0 auto}.grid button{aspect-ratio:1;padding:0;border-radius:3px;font-size:10px;background:var(--soft)}.grid button.filled{background:var(--line);border-color:var(--muted)}.grid button.selected{background:var(--accent);color:var(--paper)}.shelves{grid-template-columns:repeat(5,1fr);max-width:220px}.tabs{display:flex;gap:5px}.tabs button{flex:1;padding:8px 3px;font-size:11px}.mini{padding:7px 10px;font-size:11px}.notice{font-size:11px;color:var(--muted);min-height:17px}.map-node{padding:14px;border:1px solid var(--line);border-radius:var(--radius);text-align:left}.map-node strong{display:block}.divider{text-align:center;font-size:12px;color:var(--muted)}progress{width:100%;height:7px;accent-color:var(--accent)}.page{display:flex;justify-content:center;align-items:center;gap:16px}.page button{padding:5px 15px}.equipment{display:grid;grid-template-columns:1fr 1fr;gap:8px}.equipment button{text-align:left;min-height:63px}.equipment b{display:block;margin-top:6px;font-size:12px}.flow{display:none}dialog{max-width:350px;width:90%;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px}dialog::backdrop{background:#0008}dialog button{margin-top:14px;width:100%}@media(min-width:1000px){.shell{margin-left:calc(50% - 110px)}.flow{display:block;position:absolute;left:calc(50% - 420px);top:70px;width:245px}.flow h2{font-size:21px}.flow p{margin:14px 0}.flow button{width:100%;margin-top:5px;text-align:left;padding:9px 12px}.flow small{display:block;margin-top:14px}}@media(max-height:700px){.shell{grid-template-rows:22px 48px 1fr 48px}main{padding:9px 12px;gap:7px}.card{padding:9px}.ledger .row{padding:5px 0}button{padding:8px}h1{font-size:18px}.grid{max-width:216px}.shelves{max-width:175px}.item{padding:7px}.symbol{height:27px;width:27px}.map-node{padding:9px}.equipment button{min-height:53px}.stat{font-size:23px}}@media(max-height:580px){body{font-size:11px}main{gap:5px}.card{padding:7px}h2{margin-bottom:4px}.grid{max-width:176px}.shelves{max-width:145px}.item{padding:5px}.equipment button{min-height:43px}.equipment b{margin-top:2px}.symbol{width:22px;height:22px}.notice{font-size:10px}small,.muted{font-size:10px}}

.block{display:block;margin-top:4px}.catalog-filters{display:flex;gap:6px}.catalog-filters select{width:50%;min-width:0;padding:8px}.actions input{width:0;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}.shape{display:grid;gap:2px;flex-shrink:0;justify-content:center}.shape i{display:block;width:10px;height:10px;background:var(--accent);opacity:.65}.shape-empty{font-size:10px;color:var(--muted)}.item-mini .shape{transform:scale(.6);transform-origin:center}.item-mini{display:flex;width:35px;height:32px;align-items:center;justify-content:center}.catalog-list{display:grid;gap:6px}.catalog-list .item{min-height:62px}.real-board{max-width:min(240px,36dvh)}.real-board button{min-width:0;min-height:0}.catalog-list .shape{transform:scale(.8);transform-origin:right center}.equipment button{min-height:48px}
@media(max-height:600px){.catalog-list .item{min-height:43px;padding:5px 8px}.catalog-list .shape{max-height:46px;transform:scale(.55);transform-origin:center}.catalog-filters select{padding:5px}.real-board{max-width:175px}.equipment button{min-height:38px;padding:5px}}

.intake{padding:10px}.intake h2{margin:0;font-size:12px}.intake>.row+.row{margin-top:7px}.intake .actions{flex-shrink:0}.intake .actions>*{white-space:nowrap}.intake b{font-size:12px}.intake~.real-board{max-width:min(220px,29dvh)}
@media(max-height:600px){.intake{padding:6px}.intake~.real-board{max-width:145px}.intake .mini{padding:5px}.intake b{font-size:11px}.intake h2{font-size:11px}}

.real-board,.incoming-draggable{touch-action:none;user-select:none;-webkit-user-select:none}.real-board .filled,.incoming-draggable{cursor:grab}.dragging,.dragging *{cursor:grabbing!important}.real-board button.drop-preview{background:var(--accent);color:var(--paper);outline:2px solid var(--ink);outline-offset:-2px;opacity:.65}.drag-ghost{position:fixed;z-index:99;pointer-events:none;padding:7px 10px;border:1px solid var(--accent);border-radius:6px;background:var(--paper);color:var(--ink);font-size:12px;box-shadow:0 3px 15px #0002;max-width:180px}.drag-ghost.invalid{opacity:.45}.incoming-draggable{padding:5px 0}
</style>
<aside class="flow"><small>SHOP GAME / WIREFRAME 01</small><h2>一日の流れを<br>そのまま確かめる。</h2><p class="muted">現行ゲームを基にした画面設計モック。アイテム定義をJSONから読み込みます。経済の数値は動作確認用です。</p><div id="flow"></div><small>常設タブから経営へ戻ると、進行中の工程を再開します。<br><br>スマートフォン優先／画面内で完結<br>一覧はページ切替／スキン切替対応</small></aside>
<div class="shell"><div class="prototype"><span>画面設計モック · サンプルデータ</span><button onclick="reset()">最初から</button></div><header><div><strong>村のよろず屋</strong><small id="date"></small></div><b id="gold"></b></header><main id="view"></main><nav id="nav"></nav></div><dialog id="modal"><h2 id="modalTitle"></h2><p id="modalBody"></p><button onclick="document.querySelector('dialog').close()">閉じる</button></dialog>
<script>
const $=s=>document.querySelector(s);const phases=['報告','仕入れ','倉庫整理','陳列','支援','営業'];const navs=[['home','⌂','経営'],['warehouse','▦','倉庫'],['residents','♧','住人'],['adventurers','♙','冒険者'],['journal','≡','日誌'],['settings','⚙','設定']];
let day=2,phase=0,screen='home',gold=1250,counts=[0,0,0],pending=[],stock=['鉄の剣','木の盾','革の鎧','薬草','鉄の斧','魔晶石'],shelf=[],selected=0,page=0,sub=0,party=0,funds=0,away=false,rotate=false;const prices=[150,150,120];const icons=['Ⅰ','□','◇','＋','Ⅼ','◆'];
const title=(a,b='')=>`<div class="heading"><h1>${a}</h1>${b?`<span class="tag">${b}</span>`:''}</div>`;const btn=(s,fn,cl='')=>`<button class="${cl}" onclick="${fn.replaceAll('"','&quot;')}">${s}</button>`;const card=s=>`<section class="card">${s}</section>`;const steps=()=>`<div class="steps">${phases.map((p,i)=>`<span class="${phase===i?'current':''}">${p}</span>`).join('')}</div>`;const next=(label='次へ')=>`<div class="bottom"><div class="actions">${phase>0&&phase<5?btn('前の工程',`phase--;go('home')`):''}${btn(label,'advance()','primary')}</div>${steps()}</div>`;const row=(a,b)=>`<div class="row"><span>${a}</span><b>${b}</b></div>`;const note=s=>`<p class="muted">${s}</p>`;const money=n=>n.toLocaleString()+' G';
function go(id){screen=id;page=0;sub=0;render()}function advance(){if(pending.length){go('trade');return}if(phase===5){day++;phase=0;away=false}else phase++;go('home')}function reset(){day=2;phase=0;gold=1250;counts=[0,0,0];pending=[];stock=['鉄の剣','木の盾','革の鎧','薬草','鉄の斧','魔晶石'];shelf=[];funds=0;away=false;go('home')}
function info(a,b){$('#modalTitle').textContent=a;$('#modalBody').textContent=b;$('#modal').showModal()}
function itemList(items,fn){let shown=items.slice(page*3,page*3+3);return `<div class="list">${shown.map((x,i)=>`<button class="item ${selected===page*3+i?'active':''}" onclick="${fn.replaceAll('INDEX',page*3+i)}"><span><span class="symbol">${icons[(page*3+i)%6]}</span><b>${x}</b></span><small>選択 ›</small></button>`).join('')||note('商品はありません')}</div>${items.length>3?`<div class="page">${btn('‹',`page=Math.max(0,page-1);render()`)}<small>${page+1} / ${Math.ceil(items.length/3)}</small>${btn('›',`page=Math.min(${Math.ceil(items.length/3)-1},page+1);render()`)}</div>`:''}`}
function home(){if(phase===0)return report();if(phase===1)return purchase();if(phase===2)return warehouse(true);if(phase===3)return stocking();if(phase===4)return support(true);return sales()}
function report(){return title(sub?'仲間の帰還報告':'朝の営業報告',`春 ${day}日`)+(sub?card(`<h2>第1パーティが帰還</h2><p>リナ・ブラン・ノアが帰還しました。</p><br>${row('周辺の森','攻略 24 / 60')}<progress value="24" max="60"></progress><br><br>${row('仲間の状態','全員活動可能')}${note('帰還・回復結果をここでまとめて確認。')}`):card(`<div class="ledger">${row('前日の売上','＋480 G')}${row('仕入れ','−300 G')}${row('支度金','−100 G')}${row('現金収支','＋80 G')}</div>`)+card('<h2>村の噂</h2>'+note('現行仕様：記録なし')))+`<div class="bottom">${btn(sub?'確認して仕入れへ':'次へ · 帰還報告',sub?'advance()':'sub=1;render()','primary')}${sub?btn('収支に戻る','sub=0;render()','mini'):''}${steps()}</div>`}
function purchase(){let total=counts.reduce((a,n,i)=>a+n*prices[i],0);return title('今日の仕入れ','02 / 06')+note('商人ごとに回数を選択。1回につき1品が入荷。')+['武器商','防具商','道具商'].map((name,i)=>card(`<div class="merchant"><div><h2>${name}</h2><small>1回 ${prices[i]} G</small></div><div class="counter">${btn('−',`counts[${i}]=Math.max(0,counts[${i}]-1);render()`)}<b>${counts[i]}</b>${btn('＋',`counts[${i}]++;render()`)}</div></div>`)).join('')+card(row('合計 '+counts.reduce((a,n)=>a+n,0)+' 品',money(total)))+note('村人の動画報酬：現行では未実装')+`<div class="bottom">${btn('仕入れて入荷品を確認','buy()','primary')} ${btn('今日は仕入れない','phase=2;go("home")','mini')}${steps()}</div>`}
function buy(){let total=counts.reduce((a,n,i)=>a+n*prices[i],0);if(!total)return info('回数を選択','仕入れる商人の＋ボタンで回数を選んでください。');if(total>gold)return info('所持金が足りません','回数を減らしてください。');gold-=total;pending=counts.flatMap((n,i)=>Array.from({length:n},()=>['鉄の剣','木の盾','薬草'][i]));counts=[0,0,0];go('trade')}
function trade(){return title('入荷品の振り分け',`残り ${pending.length} 品`)+note('各商品を収納するか、商人へ引き取ってもらいます。')+(pending.length?card(`<small>入荷置き場 · 1品ずつ確認</small><div class="hero-placeholder" style="height:80px;margin:12px 0">${pending[0]}</div>${row('販売価格（例）','200 G')}<br><div class="actions">${btn('倉庫へ収納','stock.push(pending.shift());render()','primary')}${btn('商人へ渡す · 20 G','pending.shift();gold+=20;render()')}</div>`):card('<h2>入荷品の処理が完了しました</h2>'+note('取引を終えて倉庫整理に進めます。')))+card(row('倉庫の在庫',stock.length+' 点'))+`<div class="bottom">${btn('倉庫を確認',`go('warehouse')`)}<button class="primary" onclick="phase=2;go('home')" ${pending.length?'disabled':''}>取引を終える · 倉庫整理へ</button></div>`}
function warehouse(routine=false){return title('倉庫',stock.length+' 点')+`<div class="tabs">${btn('配置',`sub=0;render()`,sub===0?'active':'')}${btn('商品一覧',`sub=1;render()`,sub===1?'active':'')}</div>`+(sub?itemList(stock,'selected=INDEX;render()'):`<div class="grid">${Array.from({length:64},(_,i)=>`<button class="${i<stock.length*3?'filled':''} ${i===selected?'selected':''}" onclick="selected=${i};render()" aria-label="倉庫 ${i+1}マス">${i<stock.length*3?icons[Math.floor(i/3)%6]:''}</button>`).join('')}</div>`)+card(`<div class="row"><div><h2>${stock[Math.min(selected,stock.length-1)]||'商品を選択'}</h2><small>配置確認用の仮表示 · ${rotate?'縦':'横'}向き</small></div>${btn('↻ 回転','rotate=!rotate;render()','mini')}</div>`)+note('配置は設計用の簡易表示。衝突判定・実際の移動は未接続。')+(routine?next('陳列へ'):`<div class="bottom">${btn(pending.length?'入荷品の振り分けに戻る':'経営に戻る',`go('${pending.length?'trade':'home'}')`,'primary')}</div>`)}
function stocking(){return title('店舗の陳列','04 / 06')+`<div class="tabs">${btn('商品の補充','sub=0;render()',!sub?'active':'')}${btn('棚・設備の配置','sub=1;render()',sub?'active':'')}</div>`+(!sub?card(row('通常棚 A · 補充済み',shelf.length+' 点 / 8 点'))+itemList(stock,'selected=INDEX;render()')+`<div class="actions">${btn('選んだ商品を補充','replenish()','primary')}${btn('1点を倉庫へ戻す','if(shelf.length)stock.push(shelf.pop());render()')}</div>`:card(`<h2>店舗レイアウト · 5 × 5</h2><div class="grid shelves">${Array.from({length:25},(_,i)=>`<button class="${[0,1,5,6,18,19].includes(i)?'filled':''}" onclick="info('設備の配置','通常棚・専用棚・設備を配置する領域です。仮組みではマス選択のみ確認できます。')">${[0,1,5,6].includes(i)?'棚':i===18?'台':''}</button>`).join('')}</div><br>${row('設備を選ぶ','通常棚 / 専用棚')}`))+note('棚と売れ残りは翌日も維持する設計。')+next('仲間の支援へ')}
function replenish(){if(stock.length&&shelf.length<8){shelf.push(stock.splice(Math.min(selected,stock.length-1),1)[0]);selected=0;page=0;render()}else info('補充できません','在庫または棚の空きを確認してください。')}
function support(routine=false){return title(routine?'仲間への支援':'冒険者',away?'遠征中':'活動可能')+`<div class="tabs">${['編成','装備','支度金',...(routine?['目的地']:[])].map((x,i)=>btn(x,`sub=${i};render()`,sub===i?'active':'')).join('')}</div>`+(sub===0?card(`<h2>第${party+1}パーティ · 3人枠</h2><div class="actions">${['リナ','ブラン','ノア'].map((n,i)=>btn('♙<br>'+n,`info('${n}','Lv.1 / HP 3 / 攻撃 3 / 防御 3。編成枠の選択と移動を置く領域です。')`)).join('')}</div><br>${btn('パーティを切替',`party=(party+1)%3;render()`,'mini')}`)+card('<h2>待機中の冒険者</h2>'+note('選択してパーティ枠へ配置。最大3パーティ。')):sub===1?card(`<h2>リナ · 装備</h2><div class="equipment">${['武器','盾','頭','体','装飾品'].map(x=>btn(x+'<b>未装備</b>',`info('${x}の候補','倉庫の対応する装備を選び、変更案を確定する画面を開きます。')`)).join('')}</div><br>${btn('支援を渡す',`info('装備の確定','本体ではここで装備の変更案を確定。仮組みではゲームデータを変更しません。')`,'primary')}`)+note('交換・取り外した旧装備は使用済みとして倉庫へ戻る。'):sub===2?card(`<h2>第${party+1}パーティの支度金</h2><div class="stat">${money(funds)}</div><br><div class="actions">${[10,100,1000].map(n=>btn('＋'+n,`if(funds+${n}<=gold)funds+=${n};render()`)).join('')}</div><br>${btn('用意した額を確認',`info('支度金','仮組みでは予定額の表示のみ。ゲーム本体では確定時に所持金から支払います。')`)}<br>${note('派遣時に消費。パーティごとに管理。')}`):`<button class="map-node active" onclick="info('周辺の森','所要1日。参加者の装備・能力と危険度を確認して派遣します。')"><strong>周辺の森</strong><small>攻略 24 / 60 · 翌朝帰還</small><progress value="24" max="60"></progress></button><div class="divider">↓</div><div class="map-node"><strong>魔物の野営地</strong><small>森を攻略すると解放</small></div>${btn(away?'遠征中':'第'+(party+1)+'パーティを派遣',`away=true;render()`,'primary')}`)+(routine?next('今日のお店を開ける'):`<div class="bottom">${note('目的地の選択・出発は経営の支援工程で行います。')}${btn('経営に戻る',`go('home')`,'primary')}</div>`)}
function sales(){return title('本日の営業','06 / 06')+card('<h2>旅の冒険者が来店</h2><p>「今日は何が並んでいるんだい？」</p>')+card(`<h2>購入結果</h2>${shelf.length?row(shelf[0],'購入 · 200 G'):note('今日は陳列した商品がないため、販売なし。')}`)+note('営業は1日1回。収支は翌朝の報告でまとめて確認。')+`<div class="hero-placeholder">来客と販売結果の表示領域</div><div class="bottom">${btn('翌日へ · 朝の報告',`if(shelf.length){gold+=200;shelf.shift()}advance()`,'primary')}${steps()}</div>`}
function residents(){return title('村の住人')+card('<h2>教会</h2>'+note('死亡した仲間の蘇生を依頼。1人100 G・翌日蘇生。')+'<br>'+row('現在の仲間','全員活動可能'))+card('<h2>大工</h2>'+note('倉庫・店舗の増築。現行では追加予定。'))+`<div class="bottom">${btn('経営に戻る',`go('home')`)}</div>`}
function journal(){let days=['春 2日','春 1日'];return title('店主の日誌')+`<div class="page">${btn('‹','page=0;render()')}<b>${days[page]}</b>${btn('›','page=1;render()')}</div>`+card(`<div class="ledger">${row('商売','売上 480 G')}${row('仕入れ','300 G')}${row('仲間への支援','支度金 100 G')}${row('遠征','周辺の森へ出発')}${row('現金収支','＋80 G')}</div>`)+note('日付ごとに短い記録を表示。会話全文は重ねない。')+`<div class="bottom">${btn('経営に戻る',`go('home')`)}</div>`}
function settings(){return title('設定')+card(`<h2>表示スキン</h2><div class="actions">${[['','標準'],['paper','紙'],['night','夜']].map(([id,s])=>btn(s,`document.documentElement.dataset.skin='${id}';render()`)).join('')}</div><br>${note('色・枠・フォントを切替。画面構成は共通。')}`)+card('<h2>言語</h2>'+note('日本語 · 仮組みは日本語のみ'))+card(`<h2>セーブデータ</h2><div class="actions">${btn('書き出し',`info('セーブ書き出し','画面配置の確認用。本体のセーブには接続していません。')`)}${btn('読み込み',`info('セーブ読み込み','画面配置の確認用。本体のセーブには接続していません。')`)}</div>`)+`<div class="bottom">${note('新機能の図鑑・耐久・固定費・破産は今回追加していません。')}${btn('次の街への出発画面を確認',`go('departure')`)}${btn('経営に戻る',`go('home')`,'primary')}</div>`}
function departure(){return title('次の街へ','条件達成後の画面')+note('現行の分岐画面を確認するためのプレビュー。')+card(`<h2>同行する仲間</h2><div class="col">${['リナ','ブラン','ノア'].map(n=>`<label><input type="checkbox"> ${n}を連れていく</label>`).join('')}</div>`)+card(`<div class="ledger">${row('必要条件','全ダンジョン攻略')}${row('資金目標','3,500 G')}${row('現在の所持金',money(gold))}</div>`)+`<div class="bottom"><button disabled>この同行者で村を出発する</button>${btn('経営に戻る',`go('home')`)}</div>`}
function render(){ $('#date').textContent=`1年 春${day}日 · ${phases[phase]}`;$('#gold').textContent=money(gold);$('#nav').innerHTML=navs.map(([id,icon,s])=>`<button class="${screen===id||id==='home'&&screen==='trade'?'active':''}" onclick="go('${id}')"><span>${icon}</span>${s}</button>`).join('');$('#view').innerHTML=({home,trade,warehouse:()=>warehouse(false),adventurers:()=>support(false),residents,journal,settings,departure}[screen]||home)();$('#flow').innerHTML=phases.map((x,i)=>btn(String(i+1).padStart(2,'0')+'　'+x,`if(pending.length){go('trade')}else{phase=${i};go('home')}`,phase===i?'active':'')).join('');}
</script>
<script src="item-core.js"></script><script src="item-ui.js"></script></html>
