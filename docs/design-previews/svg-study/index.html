</style></head><body><main><header><small>ART DIRECTION / SVG STUDY 01</small><h1>剣士と鉄の剣 — SVGの描き込み見本</h1><p>落ち着いた配色・小さな全身像・素材ごとの陰影を確認するための試作です。ゲームには未反映です。</p></header><section><figure><div class="stage"><img class="character" src="swordswoman.svg" alt="緑の外套、革鎧と剣を装備した赤茶色の髪の剣士"></div><figcaption>旅の剣士<small>128 × 192 の座標グリッド ／ 拡大表示</small></figcaption><div class="native"><img src="swordswoman.svg" width="64" height="96" alt="剣士の実寸見本"><p>小さな表示での見え方<br>64 × 96 CSS px</p></div></figure><figure><div class="stage"><img class="sword" src="iron-sword.svg" alt="刃の面、革巻きの柄と金属の鍔を描き分けた鉄の剣"></div><figcaption>鉄の剣<small>24 × 64 の座標グリッド ／ 拡大表示</small></figcaption><div class="native"><img src="iron-sword.svg" width="24" height="64" alt="剣の実寸見本"><p>小さな表示での見え方<br>24 × 64 CSS px</p></div></figure></section><p class="note">すべてSVGのパスと矩形。PNG等の画像埋め込み・グラデーション・ぼかしは使っていません。形・頭身・配色・陰影の方向を、この見本で先に確認します。</p></main></body></html>
