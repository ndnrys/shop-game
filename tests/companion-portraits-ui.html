<!doctype html><meta charset="utf-8"><pre id="status">RUNNING</pre><iframe src="../index.html" style="width:360px;height:640px"></iframe><script>
const frame=document.querySelector('iframe'),output=document.querySelector('#status');
frame.addEventListener('load',async()=>{
 const w=frame.contentWindow,d=frame.contentDocument,run=code=>w.eval(code),assert=(result,label)=>{if(!result)throw Error(label)};
 try{
  for(let i=0;i<100&&!d.querySelector('#date').textContent;i++)await new Promise(resolve=>setTimeout(resolve,20));
  run("saveReady=false;reset(false);go('adventurers');partyRosterOpen=true;render()");
  const allPortraits=run("characters.flatMap(c=>['normal','battle','resting'].map(state=>({id:c.id,state,src:c.images[state]})))");
  assert(allPortraits.length===81,'all 27 companions have three portraits');
  const images=allPortraits.map(p=>{assert(p.src.includes('assets/characters/warm/'),'new portrait '+p.id+' '+p.state);const image=new w.Image();image.src=p.src;return image});
  for(let i=0;i<200&&!images.every(image=>image.complete);i++)await new Promise(resolve=>setTimeout(resolve,20));
  assert(images.every(image=>image.naturalWidth===1024&&image.naturalHeight===1536),'81 portraits load with matching dimensions');
  const legacy=run("returnMemberPortrait({image:'assets/characters/dead/kyle.png'})");
  assert(legacy.image==='assets/characters/warm/kyle.png'&&legacy.grayscale,'legacy report uses updated grayscale portrait');
  const portrait=()=>d.querySelector('.party-slots .character-art');
  const loaded=async()=>{for(let i=0;i<100&&!portrait().complete;i++)await new Promise(resolve=>setTimeout(resolve,20));assert(portrait().naturalWidth>0,'portrait loaded')};
  const base=portrait().getAttribute('src');
  assert(base==='assets/characters/warm/kyle.png','updated normal portrait');
  await loaded();
  run("expeditions=[{party:0,members:['kyle']}];render()");
  assert(portrait().getAttribute('src')==='assets/characters/warm/battle/kyle.png','dispatch portrait');
  await loaded();
  run("expeditions=[];economyState.companions.kyle={recoveryDay:day+1};render()");
  assert(portrait().getAttribute('src')==='assets/characters/warm/resting/kyle.png','recovery portrait');
  await loaded();
  run("economyState.companions.kyle={dead:true};render()");
  assert(portrait().getAttribute('src')===base&&w.getComputedStyle(portrait()).filter==='grayscale(1)','death reuses normal with grayscale');
  assert(d.querySelector('#view').scrollHeight<=d.querySelector('#view').clientHeight+1,'mobile formation fits');
  output.textContent='PASS 81 portraits, matching dimensions, normal, dispatch, recovery, grayscale';
 }catch(e){output.textContent='FAIL '+e.stack}
},{once:true});
</script>
