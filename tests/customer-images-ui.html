<!doctype html><meta charset="utf-8"><pre id="status">RUNNING</pre><iframe src="../index.html"></iframe><script>
const q=new URLSearchParams(location.search),width=+(q.get('width')||360),height=+(q.get('height')||640),f=document.querySelector('iframe');f.style=`width:${width}px;height:${height}px`;const saved=localStorage.getItem('shop-game-save');f.onload=async()=>{try{const w=f.contentWindow,d=f.contentDocument,run=s=>w.eval(s),wait=()=>new Promise(r=>setTimeout(r,100)),assert=(v,m)=>{if(!v)throw Error(m)};while(!d.querySelector('#date').textContent)await wait();run('reset();phase=5');for(let i=0;i<7;i++){run(`tradingState.report={day,visits:[{customerId:tradingConfig.customers[${i}].id,itemIds:[],price:0}]};salesDay=day;salesShown=1;go('home')`);await wait();const im=d.querySelector('.sales-character img');assert(im?.complete&&im.naturalWidth>0,'customer image '+i);const r=im.getBoundingClientRect(),v=d.querySelector('#view');assert(r.left>=0&&r.right<=width&&r.bottom<=height,'image fits');assert(v.scrollHeight<=v.clientHeight+1,'screen fits');im.src='missing.png';await wait();assert(im.hidden&&!im.nextElementSibling.hidden,'fallback')}document.querySelector('#status').textContent=`PASS ${width}x${height} 7 customers`;}catch(e){document.querySelector('#status').textContent='FAIL '+e.stack}finally{if(saved===null)localStorage.removeItem('shop-game-save');else localStorage.setItem('shop-game-save',saved)}};
</script>
