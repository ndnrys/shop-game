<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}iframe{border:0;display:block}body.preview #status{display:none}</style><pre id="status">RUNNING</pre><iframe src="../index.html"></iframe><script>
const q=new URLSearchParams(location.search),f=document.querySelector('iframe'),width=+(q.get('width')||390),height=+(q.get('height')||844),prior=localStorage.getItem('shop-game-save');f.style=`width:${width}px;height:${height}px`;
f.onload=async()=>{const w=f.contentWindow,d=f.contentDocument,run=s=>w.eval(s),wait=n=>new Promise(r=>setTimeout(r,n)),assert=(v,m)=>{if(!v)throw Error(m)};try{while(!d.querySelector('#date').textContent)await wait(20);run('reset();saveReady=false');const ids=run('tradingConfig.customers.map(c=>c.id)');for(const {id,variant} of ids.flatMap(id=>[0,1,2].map(variant=>({id,variant})))){const expected='/customers/warm/'+id+(variant?'-'+(variant+1):'')+'.webp';run(`day=${variant+1};phase=5;salesDay=day;salesShown=1;tradingState.report={day,revenue:0,visits:[{customerId:'${id}',uids:[],itemIds:[],price:0,setId:null}]};go('home')`);await wait(150);await Promise.race([Promise.all([...d.querySelectorAll('#view img')].map(im=>im.decode())),wait(1500)]);assert(d.querySelector('.sales-scene>img').src.includes(expected),'new sales portrait '+id);assert([...d.querySelectorAll('.sales-character img,.sales-scene>img')].every(im=>im.naturalWidth===1024),'images loaded '+id);assert(d.querySelector('#view').scrollHeight<=d.querySelector('#view').clientHeight+1,'sales fits '+id);run('phase=0;go("home");sub=1;render()');await wait(150);await Promise.race([Promise.all([...d.querySelectorAll('#view img')].map(im=>im.decode())),wait(1500)]);assert(d.querySelector('.report-customer img').src.includes(expected),'new report portrait '+id);assert(d.querySelector('#view').scrollHeight<=d.querySelector('#view').clientHeight+1,'report fits '+id)}run(`day=1;phase=5;salesDay=day;salesShown=3;tradingState.report={day,revenue:0,visits:Array.from({length:3},()=>({customerId:'villager',uids:[],itemIds:[],price:0,setId:null}))};go('home')`);const latest=d.querySelector('.sales-scene>img').getAttribute('src');assert(latest.endsWith('villager-3.webp'),'third visit uses third appearance');run('render()');assert(d.querySelector('.sales-scene>img').getAttribute('src')===latest,'rerender keeps appearance');run('day=2;phase=0;go("home");sub=1;render()');const reported=[...d.querySelectorAll('.report-customer img')].map(im=>im.getAttribute('src'));assert(reported[0].endsWith('villager.webp')&&reported[1].endsWith('villager-2.webp'),'next morning keeps previous day appearances');run('page=1;render()');assert(d.querySelector('.report-customer img').getAttribute('src')===latest,'report pagination keeps appearance');assert(run('customerImage({image:"fallback.webp"},0,1)')==='fallback.webp','old image fallback');if(q.has('customer')){const id=ids.includes(q.get('customer'))?q.get('customer'):ids[0];run(`day=${Math.max(1,Math.min(3,Number(q.get('variant'))||1))};phase=5;salesDay=day;salesShown=1;tradingState.report={day,revenue:0,visits:[{customerId:'${id}',uids:[],itemIds:[],price:0,setId:null}]};go('home')`);if(q.has('report'))run('phase=0;go("home");sub=1;render()');document.body.classList.add('preview')}document.querySelector('#status').textContent='PASS '+width+'x'+height+' 21 portraits: sales and morning report'}catch(e){document.querySelector('#status').textContent='FAIL '+e.stack}finally{if(prior===null)localStorage.removeItem('shop-game-save');else localStorage.setItem('shop-game-save',prior)}};
</script>
