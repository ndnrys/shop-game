<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}iframe{border:0;display:block}body.preview #status{display:none}</style><pre id="status">RUNNING</pre><iframe src="../index.html"></iframe><script>
const q=new URLSearchParams(location.search),f=document.querySelector('iframe'),width=+(q.get('width')||390),height=+(q.get('height')||844),prior=localStorage.getItem('shop-game-save');f.style=`width:${width}px;height:${height}px`;
f.onload=async()=>{const w=f.contentWindow,d=f.contentDocument,run=s=>w.eval(s),wait=n=>new Promise(r=>setTimeout(r,n)),assert=(v,m)=>{if(!v)throw Error(m)};try{while(!d.querySelector('#date').textContent)await wait(20);run('reset();saveReady=false');const ids=run('tradingConfig.customers.map(c=>c.id)');for(const id of ids){run(`phase=5;salesDay=day;salesShown=1;tradingState.report={day,revenue:0,visits:[{customerId:'${id}',uids:[],itemIds:[],price:0,setId:null}]};go('home')`);await wait(150);await Promise.race([Promise.all([...d.querySelectorAll('#view img')].map(im=>im.decode())),wait(1500)]);assert(d.querySelector('.sales-scene>img').src.includes('/customers/warm/'+id+'.webp'),'new sales portrait '+id);assert([...d.querySelectorAll('.sales-character img,.sales-scene>img')].every(im=>im.naturalWidth===1024),'images loaded '+id);assert(d.querySelector('#view').scrollHeight<=d.querySelector('#view').clientHeight+1,'sales fits '+id);run('phase=0;go("home");sub=1;render()');await wait(150);await Promise.race([Promise.all([...d.querySelectorAll('#view img')].map(im=>im.decode())),wait(1500)]);assert(d.querySelector('.report-customer img').src.includes('/customers/warm/'+id+'.webp'),'new report portrait '+id);assert(d.querySelector('#view').scrollHeight<=d.querySelector('#view').clientHeight+1,'report fits '+id)}if(q.has('customer')){const id=ids.includes(q.get('customer'))?q.get('customer'):ids[0];run(`phase=5;salesDay=day;salesShown=1;tradingState.report={day,revenue:0,visits:[{customerId:'${id}',uids:[],itemIds:[],price:0,setId:null}]};go('home')`);document.body.classList.add('preview')}document.querySelector('#status').textContent='PASS '+width+'x'+height+' 7 customers: sales and morning report'}catch(e){document.querySelector('#status').textContent='FAIL '+e.stack}finally{if(prior===null)localStorage.removeItem('shop-game-save');else localStorage.setItem('shop-game-save',prior)}};
</script>
