assert(!run('GameEffects.active')&&run('pending.length')===n,'warehouse with items');run('counts=[1,0,0];finishPurchase()');assert(!run('GameEffects.active'),'pending does not repurchase');document.querySelector('#status').textContent=`PASS ${width}x${height}`;}catch(e){document.querySelector('#status').textContent='FAIL '+e.stack}finally{if(prior===null)localStorage.removeItem('shop-game-save');else localStorage.setItem('shop-game-save',prior)}};
