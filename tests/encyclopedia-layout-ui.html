<!doctype html><meta charset="utf-8"><pre id="status">RUNNING</pre><iframe src="../index.html" style="width:360px;height:640px;border:0"></iframe><script>
const frame=document.querySelector('iframe'),prior=localStorage.getItem('shop-game-save');frame.onload=async()=>{const w=frame.contentWindow,d=frame.contentDocument,run=s=>w.eval(s),wait=()=>new Promise(r=>setTimeout(r,40));let n=0;const ok=(v,s)=>{if(!v)throw Error(s);n++};try{while(!d.querySelector('#date').textContent)await wait();run("saveReady=false;reset(false);globalThis.originalCatalogItems=catalog.items;catalog.items=catalog.items.slice(0,10);openEncyclopedia()");for(const [width,height] of [[360,640],[390,844]]){frame.style.width=width+'px';frame.style.height=height+'px';await wait();run("page=0;encyclopediaTab='items';encyclopediaSelection=null;render()");const tile=d.querySelector('.encyclopedia-tile').getBoundingClientRect(),grid=d.querySelector('.encyclopedia-grid').getBoundingClientRect(),slider=d.querySelector('#encyclopediaPageSlider');ok(d.querySelectorAll('.encyclopedia-tile').length===9,'常に9件ずつ');slider.focus();slider.value=1;slider.dispatchEvent(new w.Event('input',{bubbles:true}));await wait();const last=d.querySelector('.encyclopedia-tile').getBoundingClientRect();ok(d.querySelectorAll('.encyclopedia-tile').length===1,'最終ページは1件');ok(Math.abs(tile.width-last.width)<1&&Math.abs(tile.height-last.height)<1,'1件でも9分割サイズを維持');ok(Math.abs(last.left-grid.left)<1&&Math.abs(last.top-grid.top)<1,'最後の1件も左上配置');ok(d.querySelector('#encyclopediaPageSlider')===slider&&d.activeElement===slider,'操作中のつまみとフォーカスを保持');ok(run('page')===1&&d.querySelector('#encyclopediaPageNumber').textContent==='2 / 2','スライダーでページ切替');slider.value=0;slider.dispatchEvent(new w.Event('input',{bubbles:true}));ok(d.querySelectorAll('.encyclopedia-tile').length===9,'離さず前のページへ戻れる');d.querySelector('.encyclopedia-tile').click();ok(d.querySelector('.encyclopedia-detail'),'詳細を開ける');run('encyclopediaSelection=null;render()');const view=d.querySelector('#view');ok(view.scrollHeight<=view.clientHeight+1&&d.documentElement.scrollWidth<=width,'スマホ内に収まる')}run("encyclopediaTab='sets';page=0;render()");ok(d.querySelector('#encyclopediaPageSlider').disabled,'1ページのタブはつまみを無効化');run("catalog.items=originalCatalogItems;encyclopediaTab='items';page=0;render()");ok(Number(d.querySelector('#encyclopediaPageSlider').max)===Math.ceil(run('catalog.items.length')/9)-1,'全商品も9件単位のページ数');document.querySelector('#status').textContent='PASS '+n+' checks';}catch(e){document.querySelector('#status').textContent='FAIL '+e.stack}finally{if(prior===null)localStorage.removeItem('shop-game-save');else localStorage.setItem('shop-game-save',prior)}};
</script>
