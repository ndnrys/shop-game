<!doctype html><meta charset="utf-8"><title>画像ヘッダー・フッター検証</title>
<style>body{margin:0;background:#e4dac8}iframe{display:block;border:0;margin:auto}#status{white-space:pre-wrap;margin:0}body.preview #status{display:none}</style>
<pre id="status">RUNNING</pre><iframe src="../index.html"></iframe>
<script>
const q=new URLSearchParams(location.search),width=+(q.get('width')||360),height=+(q.get('height')||640),f=document.querySelector('iframe'),saved=localStorage.getItem('shop-game-save');f.style=`width:${width}px;height:${height}px`;
f.onload=async()=>{try{const w=f.contentWindow,d=f.contentDocument,run=s=>w.eval(s),wait=n=>new Promise(r=>setTimeout(r,n));while(!d.querySelector('#date').textContent)await wait(20);run('saveReady=false;phase=0;go("home")');
 const assert=(v,m)=>{if(!v)throw Error(m)},inside=(el,parent)=>{const a=el.getBoundingClientRect(),b=parent.getBoundingClientRect();return a.left>=b.left-1&&a.right<=b.right+1&&a.top>=b.top-1&&a.bottom<=b.bottom+1};let count=0;
 const preview=q.has('preview'),langs=preview?[q.get('lang')||'ja']:['ja','en','ja'],skins=preview?[q.get('skin')||'']:['','paper','night'];
 for(const lang of langs)for(const skin of skins){run(`language=${JSON.stringify(lang)};document.documentElement.dataset.skin=${JSON.stringify(skin)};render()`);await wait(100);const header=d.querySelector('header'),nav=d.querySelector('#nav'),buttons=[...nav.querySelectorAll(':scope>button')];assert(w.getComputedStyle(header,'::before').borderImageSource.includes('header-panel.webp'),'header asset');assert(w.getComputedStyle(nav,'::before').borderImageSource.includes('footer-panel.webp'),'footer asset');assert(header.querySelector('strong').textContent===(lang==='ja'?'村のよろず屋':'Village General Store'),'localized shop title');assert(buttons.at(-1).textContent.trim()===(lang==='ja'?'メニュー':'Menu'),'localized menu');assert(header.querySelector('strong').children.length===0,'title remains HTML text');assert(buttons.length===5&&buttons.every(b=>b.querySelector('svg')),'five live navigation buttons');assert([...header.children].every(el=>inside(el,header)),'header fits');assert(buttons.every(b=>inside(b,nav)&&b.scrollHeight<=b.clientHeight+1&&b.scrollWidth<=b.clientWidth+1),'translated footer fits '+lang+'/'+skin+' '+JSON.stringify(buttons.map(b=>[b.textContent.trim(),b.clientHeight,b.scrollHeight,inside(b,nav)])));assert(nav.getBoundingClientRect().bottom<=height+1,'footer fits viewport');const view=d.querySelector('#view');assert(view.scrollHeight<=view.clientHeight+1,'game fits');count++;}
 if(!preview){run('toggleMenu()');assert(d.querySelector('.nav-more').getBoundingClientRect().top>=0,'popup fits');d.querySelector('.nav-more button').click();assert(run('screen')==='settings','menu still usable');}
 document.querySelector('#status').textContent=`PASS ${width}x${height} ${count} language/skin combinations`;if(preview)document.body.classList.add('preview');
}catch(e){document.querySelector('#status').textContent='FAIL '+e.stack}finally{if(saved===null)localStorage.removeItem('shop-game-save');else localStorage.setItem('shop-game-save',saved)}};
</script>
