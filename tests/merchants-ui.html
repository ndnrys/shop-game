<!doctype html><meta charset="utf-8"><pre id="status">RUNNING</pre><iframe src="../index.html"></iframe><script>
const q=new URLSearchParams(location.search),width=+(q.get('width')||360),height=+(q.get('height')||640),f=document.querySelector('iframe');f.style=`width:${width}px;height:${height}px`;const prior=localStorage.getItem('shop-game-save');
f.onload=async()=>{const w=f.contentWindow,d=f.contentDocument,run=s=>w.eval(s),wait=n=>new Promise(r=>setTimeout(r,n)),assert=(v,m)=>{if(!v)throw Error(m)};try{
while(!d.querySelector('#date').textContent)await wait(20);
run('reset();gold=10000;phase=1;counts=[1,1,1];go("home")');
await wait(100);assert([...d.querySelectorAll('[data-merchant-icon]:not([hidden])')].every(im=>im.complete&&im.naturalWidth>0),'icons loaded');
assert(d.querySelectorAll('[data-merchant-icon]:not([hidden])').length===3,'three icons');
assert(d.documentElement.scrollWidth<=width+1,'no horizontal overflow');
assert(d.querySelector('#view').scrollHeight<=d.querySelector('#view').clientHeight+1,'purchase content fits');
for(const im of d.querySelectorAll('[data-merchant-icon]:not([hidden])')){const r=im.getBoundingClientRect();assert(r.left>=0&&r.right<=width&&r.bottom<=height,'icon fits');assert(w.getComputedStyle(im).objectFit==='cover','icon aspect preserved')}
const icons=()=>[...d.querySelectorAll('[data-merchant-icon]:not([hidden])')];
assert(icons().every(im=>im.src.split('?')[0].endsWith('-normal.webp')),'right column default');
for(let i=0;i<3;i++){
 d.querySelectorAll('.counter button')[i*2+1].click();
 assert(icons()[i].src.split('?')[0].endsWith('-happy.webp'),'plus happy');
 await wait(250);d.querySelectorAll('.counter button')[i*2].click();
 assert(icons()[i].src.split('?')[0].endsWith('-troubled.webp'),'minus troubled');
 await wait(300);assert(icons()[i].src.split('?')[0].endsWith('-troubled.webp'),'last press restarts timer');
 await wait(250);assert(icons()[i].src.split('?')[0].endsWith('-normal.webp'),'returns after 500ms');
}
run('counts=[0,1,1];render()');d.querySelectorAll('.counter button')[0].click();
assert(run('counts[0]')===0&&icons()[0].src.split('?')[0].endsWith('-troubled.webp'),'zero minus feedback');
await wait(550);run('counts=[1,1,1];render()');
run('finishPurchase()');const n=run('pending.length'),gold=run('gold');
for(const name of ['武器商','防具商','道具商']){await wait(1000);const im=d.querySelector('.effect-merchant-portrait');assert(im?.alt===name,'correct merchant '+name);assert(im.complete&&im.naturalWidth===1024,'portrait loaded');assert(w.getComputedStyle(im.parentElement).animationName==='merchant-travel','CSS animation');im.parentElement.style.animation='none';const r=im.getBoundingClientRect(),stage=im.closest('.effect-merchant-stage').getBoundingClientRect();assert(stage.left>=0&&stage.right<=width+1&&stage.top>=0&&stage.bottom<=height+1,'portrait stage fits');assert(r.width>72,'large portrait');assert([...d.querySelectorAll('.effect-merchant-portrait,.effect-host')].every(image=>image.getBoundingClientRect().top>=stage.top+stage.height*.05),'heads stay below stage top');await wait(400)}
d.querySelector('.game-effect>button').click();assert(d.querySelector('.effect-products'),'skip to results');
assert(run('pending.length')===n&&run('gold')===gold,'effect preserves purchase');while([...d.querySelectorAll('.game-effect button')].some(b=>b.textContent==='次へ'))[...d.querySelectorAll('.game-effect button')].find(b=>b.textContent==='次へ').click();[...d.querySelectorAll('.game-effect button')].find(b=>b.textContent==='倉庫整理へ').click();assert(!run('GameEffects.active'),'warehouse button finishes effect');
run('GameEffects.play("purchase",{merchants:[2],items:[]})');const broken=d.querySelector('.effect-merchant-portrait');broken.src='missing-merchant.png';await wait(50);assert(broken.hidden,'failed image hidden');d.querySelector('.game-effect>button').click();assert(d.querySelector('.effect-products'),'failure can continue');run('document.querySelector(".game-effect").close()');
document.querySelector('#status').textContent=`PASS ${width}x${height}`;
}catch(e){document.querySelector('#status').textContent='FAIL '+e.stack}finally{if(prior===null)localStorage.removeItem('shop-game-save');else localStorage.setItem('shop-game-save',prior)}};
</script>
