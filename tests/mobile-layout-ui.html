<!doctype html><meta charset="utf-8"><pre id="status">RUNNING</pre><iframe id="game" src="../index.html" style="border:0"></iframe><script>

frame.style.width='390px';frame.style.height='844px';d.querySelector('.shell').style.padding='24px 0 24px';await wait();run("phase=4;go('home')");ok(d.querySelector('header').getBoundingClientRect().top>=24&&d.querySelector('#nav').getBoundingClientRect().bottom<=820,'上下の安全領域内に表示');run("day=12;language='ja';renderHeader()");ok(d.querySelector('#date').textContent==='1年目秋2日','年・季節・日付を表示');run("day=21;renderHeader()");ok(d.querySelector('#date').textContent==='2年目春1日','年の繰り上がり');run("language='en';renderHeader()");ok(d.querySelector('#date').textContent==='Year 2 Spring 1','英語の日付');document.querySelector('#status').textContent='PASS '+checks+' checks / 7 phone sizes';}catch(e){document.querySelector('#status').textContent='FAIL '+e.stack}finally{if(prior===null)localStorage.removeItem('shop-game-save');else localStorage.setItem('shop-game-save',prior)}};
</script>
