<!doctype html><meta charset="utf-8"><title>仕入れ商品一覧の確認</title><style>body{margin:0}iframe{display:block;border:0}pre{position:fixed;z-index:9;margin:0;background:white}body.preview pre{display:none}</style><pre id="status">RUNNING</pre><iframe src="../index.html"></iframe><script>
const q=new URLSearchParams(location.search),width=+(q.get('width')||390),height=+(q.get('height')||844),frame=document.querySelector('iframe');frame.style=`width:${width}px;height:${height}px`;if(q.has('preview'))document.body.classList.add('preview');frame.onload=async()=>{const w=frame.contentWindow,d=frame.contentDocument,run=code=>w.eval(code),wait=ms=>new Promise(r=>setTimeout(r,ms));let checks=0;const ok=(value,message)=>{if(!value)throw Error(message);checks++};try{while(!d.querySelector('#date').textContent)await wait(20);run("saveReady=false;gold=1000;pending=[];GameEffects.play('purchase',{merchants:[],items:['one_hand_sword_01','shield_01','accessory_01','body_light_01','head_light_11'].map(id=>purchasedItemSummary(newItem(id))),additionalPurchase:purchaseAdditional,availableGold:()=>gold})");d.querySelector('.game-effect[open]>button').click();await wait(100);ok(d.querySelectorAll('.effect-products-list article').length===5,'全商品表示');for(const card of d.querySelectorAll('.effect-products-list article')){const img=card.querySelector('img');ok(w.getComputedStyle(img).position==='absolute'&&Number(w.getComputedStyle(img).opacity)<.3,'画像を薄い背景に配置');ok(parseFloat(w.getComputedStyle(card.querySelector('b')).fontSize)>=14,'商品名を拡大');ok([...card.querySelectorAll('button')].every(button=>button.getBoundingClientRect().left>=card.getBoundingClientRect().left&&button.getBoundingClientRect().right<=card.getBoundingClientRect().right),'カード内に個数操作を表示')}ok(d.querySelector('.effect-current-gold').textContent.includes('1,000'),'現在の所持金');const prior=run('gold');d.querySelector('.effect-item-quantity button:last-child').click();d.querySelector('.effect-item-quantity button:last-child').click();d.querySelector('.effect-additional-purchase').click();ok(run('pending.length===2&&pending.every(item=>item.itemId===\'one_hand_sword_01\')'),'同じ商品を2個追加');ok(run('gold')<prior&&d.querySelector('.effect-current-gold').textContent.includes(run('gold').toLocaleString()),'購入後の所持金を更新');const dialog=d.querySelector('.game-effect');ok(dialog.scrollWidth<=dialog.clientWidth,'横はみ出しなし');await Promise.race([Promise.all([...dialog.querySelectorAll('img')].map(img=>img.decode().catch(()=>{}))),wait(1000)]);document.querySelector('#status').textContent='PASS '+checks+' checks '+width+'x'+height}catch(e){document.querySelector('#status').textContent='FAIL '+e.stack}};
</script>
