<!doctype html><meta charset="utf-8"><pre id="status">RUNNING</pre><iframe src="../index.html" style="width:360px;height:640px;border:0"></iframe><script>
const frame=document.querySelector('iframe'),prior=localStorage.getItem('shop-game-save');frame.onload=async()=>{const w=frame.contentWindow,d=frame.contentDocument,run=s=>w.eval(s),wait=()=>new Promise(r=>setTimeout(r,40));let n=0;const ok=(v,s)=>{if(!v)throw Error(s);n++};try{while(!d.querySelector('#date').textContent)await wait();run("saveReady=false;reset(false);phase=0;tradingState.report={day:1,visits:tradingConfig.customers.slice(0,3).map(c=>({customerId:c.id,uids:[],itemIds:[],price:0}))};groupedReturnReport=[{destination:'周辺の森',totalProgress:25,party:0,progress:'攻略 +25%',members:[{id:'kyle',name:'カイル',events:['負傷 · 回復まで2日'],image:characters[0].images.normal}]}];go('home')");for(const [width,height] of [[360,640],[390,844],[430,932]]){frame.style.width=width+'px';frame.style.height=height+'px';await wait();let base;for(let sub=0;sub<4;sub++){run(`sub=${sub};page=0;render()`);await wait();const speech=d.querySelector('.report-clerk-speech').getBoundingClientRect(),scene=d.querySelector('.report-clerk').getBoundingClientRect(),content=d.querySelector('.report-speech-content'),art=d.querySelector('.report-clerk-art').getBoundingClientRect();if(!base)base=speech;ok(['x','y','width','height'].every(k=>Math.abs(speech[k]-base[k])<1),'吹き出しの位置寸法固定 '+width+' '+sub);ok(Math.abs(scene.top-speech.top)<1,'上から開始');ok([...content.children].every(e=>e.getBoundingClientRect().bottom<=speech.bottom-2),'文章が枠内に収まる');ok(art.top>=speech.bottom&&art.height>0,'人物は紙の下の領域');const view=d.querySelector('#view');ok(view.scrollHeight<=view.clientHeight+1,'画面内に収まる');}}document.querySelector('#status').textContent='PASS '+n+' checks'}catch(e){document.querySelector('#status').textContent='FAIL '+e.stack}finally{if(prior===null)localStorage.removeItem('shop-game-save');else localStorage.setItem('shop-game-save',prior)}};
</script>
