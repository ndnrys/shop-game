<!doctype html><meta charset="utf-8"><pre id="status">RUNNING</pre><iframe src="../index.html" style="width:360px;height:640px"></iframe><script>
const f=document.querySelector('iframe'),saved=localStorage.getItem('shop-game-save');f.onload=async()=>{const w=f.contentWindow,d=f.contentDocument,run=s=>w.eval(s),wait=n=>new Promise(r=>setTimeout(r,n)),assert=(v,m)=>{if(!v)throw Error(m)};try{while(!d.querySelector('#date').textContent)await wait(20);run(`reset();saveReady=false;phase=5;salesDay=day;salesShown=0;tradingState.report={day,revenue:0,visits:['villager','warrior'].map(customerId=>({customerId,uids:[],itemIds:[],price:0,setId:null}))};go('home')`);await wait(750);assert(run('salesShown')===1,'first arrival');const portrait=d.querySelector('.sales-scene>img');assert(w.getComputedStyle(portrait).animationName==='customer-arrive','portrait fade');assert(w.getComputedStyle(d.querySelector('.sales-scene')).backgroundImage.includes('shop-entrance.webp'),'shopkeeper view toward entrance');assert(w.getComputedStyle(portrait).animationDuration==='0.8s','gentle 800ms arrival');await wait(1000);assert(run('salesShown')===1,'customer held beyond old interval');await wait(650);assert(run('salesShown')===2,'second customer after 1.6 seconds');assert(d.querySelectorAll('.sales-visit-enter').length===1,'only newest history card animates');assert(run('tradingState.report.revenue')===0,'revenue unchanged');assert(d.querySelector('#view').scrollHeight<=d.querySelector('#view').clientHeight+1,'fits mobile');document.querySelector('#status').textContent='PASS mobile: 1.6s customer hold, fade, history, revenue'}catch(e){document.querySelector('#status').textContent='FAIL '+e.stack}finally{if(saved===null)localStorage.removeItem('shop-game-save');else localStorage.setItem('shop-game-save',saved)}};
</script>
