<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店舗プレビュー</title>
<link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/warehouse.css"><link rel="stylesheet" href="../css/skins/fantasy.css">
</head><body data-skin="fantasy"><main class="app-shell" id="preview"></main>
<script type="module">
import skin from '../js/data/skins/fantasy/index.js';
import {createSession} from '../js/application/createSession.js';
import {mountStocking} from '../js/ui/stocking.js';
import {applyTranslations} from '../js/ui/i18n.js';
const root=document.querySelector('#preview');
const source=new DOMParser().parseFromString(await(await fetch('../index.html')).text(),'text/html');
const section=source.querySelector('#stocking-screen');section.hidden=false;root.append(section);
const game=createSession(skin);
for(const [key,value] of Object.entries(skin.theme))document.documentElement.style.setProperty(key,value);
applyTranslations(root,game.i18n);
const view=mountStocking(root,game);game.subscribe(view.render);
</script></body></html>
