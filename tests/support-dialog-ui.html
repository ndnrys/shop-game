<!doctype html><meta charset="utf-8"><title>物資と治療の確認</title><pre id="status">RUNNING</pre><iframe src="../index.html"></iframe><script>
const q=new URLSearchParams(location.search),width=+(q.get('width')||360),height=+(q.get('height')||640),frame=document.querySelector('iframe'),saved=localStorage.getItem('shop-game-save');frame.style=`width:${width}px;height:${height}px;border:0`;if(q.has('preview')){document.body.style.margin=0;document.querySelector('#status').style.display='none'}
frame.onload=async()=>{const w=frame.contentWindow,d=frame.contentDocument,run=s=>w.eval(s),assert=(v,m)=>{if(!v)throw Error(m)},fit=()=>{const v=d.querySelector('#view'),dialog=d.querySelector('#supportDialog');assert(v.scrollHeight<=v.clientHeight+1,'main fit');if(dialog.open)assert(dialog.scrollHeight<=dialog.clientHeight+1&&dialog.getBoundingClientRect().bottom<=height,'modal fit')};try{while(!d.querySelector('#date').textContent)await new Promise(r=>setTimeout(r,20));const setup=`saveReady=false;reset(false);language=${JSON.stringify(q.get('lang')||'ja')};phase=4;go('home')`;run(setup);assert(d.querySelector('.support-supply-summary'),'summary below characters');run('partyRosterOpen=true;render()');assert(!d.querySelector('.formation-supply,.support-supply-summary'),'no supplies on formation');run('partyRosterOpen=false;render()');const before=run('gold'),origin=run('screen');d.querySelector('[onclick="openSupportDialog()"]').click();assert(d.querySelector('#supportDialog').open&&run('screen')===origin&&!run('assistanceOpen&&partyRosterOpen'),'opens modal without navigating');assert(!d.querySelector('.support-treatment'),'healthy treatment hidden');d.querySelector('[data-support-control="plus0"]').click();assert(run('supplies[party][0]')===1&&run('gold')===before,'planning does not charge');assert(d.querySelector('#supportDialog').open&&d.querySelector('.support-supply-summary').textContent.includes('100'),'modal stays open and summary updates');for(let i=0;i<4;i++)d.querySelector('[data-support-control="plus0"]').click();assert(run('supplies[party][0]')===3&&d.querySelector('[data-support-control="plus0"]').disabled,'three item cap');d.querySelector('.support-dialog-done').click();assert(!d.querySelector('#supportDialog').open,'close modal');
run(`economyState.companions.mira={recoveryDay:day+2};economyState.companions.gares={dead:true};openSupportDialog()`);assert(d.querySelectorAll('[data-treatment]').length===2,'only recovering/dead');assert(!d.querySelector('[data-treatment="kyle"]'),'healthy companion omitted');fit();const cost=run('companionLevel("mira")*economyConfig.healing.costPerLevel'),goldBefore=run('gold');d.querySelector('[data-support-control="healmira"]').click();assert(run('gold')===goldBefore-cost&&run('companionStatus("mira")')==='waiting','existing treatment cost');assert(!d.querySelector('[data-treatment="mira"]')&&d.querySelector('[data-treatment="gares"]'),'healed row removed, dead state retained');run('closeSupportDialog();party=1;render();openSupportDialog()');assert(!d.querySelector('.support-treatment'),'other party has no treatment');run('closeSupportDialog();party=0;render();depart();openSupportDialog()');assert([...d.querySelectorAll('.support-supply-counter button')].every(b=>b.disabled),'supplies locked while away');fit();
run(setup);run('economyState.companions.kyle={recoveryDay:day+3};economyState.companions.gares={recoveryDay:day+2};economyState.companions.mira={dead:true};openSupportDialog()');fit();document.querySelector('#status').textContent=`PASS ${width}x${height} ${q.get('lang')||'ja'} shared modal, healthy hidden, treatment, supply limits, charge timing, locked away, fit`;
}catch(e){document.querySelector('#status').textContent='FAIL '+e.stack}finally{if(saved===null)localStorage.removeItem('shop-game-save');else localStorage.setItem('shop-game-save',saved)}};
</script>
