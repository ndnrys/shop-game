<!doctype html><meta charset="utf-8"><title>支援操作の確認</title><pre id="status">RUNNING</pre><iframe src="../index.html"></iframe><script>
const q=new URLSearchParams(location.search),width=+(q.get('width')||360),height=+(q.get('height')||640),frame=document.querySelector('iframe'),saved=localStorage.getItem('shop-game-save');frame.style=`width:${width}px;height:${height}px;border:0`;if(q.has('preview')){document.body.style.margin=0;document.querySelector('#status').style.display='none'}
frame.onload=async()=>{const w=frame.contentWindow,d=frame.contentDocument,run=s=>w.eval(s),assert=(v,m)=>{if(!v)throw Error(m)},fit=()=>assert(d.querySelector('#view').scrollHeight<=d.querySelector('#view').clientHeight+1,'mobile fit');try{while(!d.querySelector('#date').textContent)await new Promise(r=>setTimeout(r,20));const setup=`saveReady=false;reset(false);language=${JSON.stringify(q.get('lang')||'ja')};phase=4;parties=[['kyle','mira'],['gares'],[]];economyState.companions.mira={recoveryDay:day+2};party=0;go('home')`;run(setup);fit();assert(d.querySelectorAll('[data-support-party]').length===3,'direct switches');assert(d.querySelectorAll('[data-support-member]').length===2,'only assigned companions');assert(d.querySelector('[data-companion-status="recovering"] .support-member-status').textContent.includes('2'),'recovery days');assert(d.querySelector('[data-support-member="kyle"] .support-risk'),'ready companion risk visible');assert(!d.querySelector('[data-companion-status="recovering"] .support-risk'),'no risk on recovering companion');assert(w.getComputedStyle(d.querySelector('[data-companion-status="recovering"] .support-portrait')).backgroundColor==='rgb(221, 220, 215)','recovery gray background');assert(w.getComputedStyle(d.querySelector('.support-name-row')).backgroundColor==='rgb(255, 253, 247)','white name area');run("globalThis.originalDanger=config.dungeons[0].danger;config.dungeons[0].danger=0;render()");assert(d.querySelector('[data-support-member="kyle"] [data-risk="safe"]'),'safe risk updates');run('config.dungeons[0].danger=10000;render()');assert(d.querySelector('[data-support-member="kyle"] [data-risk="danger"]'),'danger risk updates');run('config.dungeons[0].danger=originalDanger;render()');const cards=d.querySelectorAll('[data-support-member]'),row=d.querySelector('.expedition-portraits').getBoundingClientRect();assert(Math.abs(cards[0].getBoundingClientRect().width-(row.width-16)/3)<2,'fixed third width');assert(Math.abs(cards[0].getBoundingClientRect().left-row.left)<2,'left aligned cards');assert(d.querySelector('.support-portrait').getBoundingClientRect().width>=cards[0].getBoundingClientRect().width-4,'face fills tile');assert(d.querySelectorAll('.destination-card').length===1&&!d.querySelector('.destination-controls'),'only available destination, no pager');assert(!d.querySelector('.destination-card progress'),'no progress bar');assert(d.querySelectorAll('.destination-info>div').length===3,'three concise fields');assert(d.querySelector('.destination-card[data-selected="true"] .destination-info').getBoundingClientRect().bottom<=d.querySelector('.destination-glass').getBoundingClientRect().bottom,'info stays inside glass');const partyHeight=d.querySelector('.expedition-party').getBoundingClientRect().height,destinationTop=d.querySelector('.destination-panel').getBoundingClientRect().top;
 const firstDestination=run('selectedDungeon');run("dungeonProgress.forest=config.dungeons.find(d=>d.id==='forest').requiredProgress;render()");assert(d.querySelectorAll('.destination-card').length===2&&d.querySelector('.destination-controls'),'second destination unlocked with pager');const urls=[...d.querySelectorAll('.destination-art')].map(im=>im.getAttribute('src'));assert(new Set(urls).size===2,'different images for each place');await Promise.race([Promise.all([...d.querySelectorAll('.destination-art')].map(im=>im.decode())),new Promise(resolve=>setTimeout(resolve,1500))]);const carousel=d.querySelector('.destination-carousel');carousel.scrollLeft=carousel.clientWidth;carousel.dispatchEvent(new w.Event('scroll'));await new Promise(r=>setTimeout(r,220));assert(run('selectedDungeon')!==firstDestination,'horizontal scroll switches available destination');assert(!d.querySelector('[onclick="depart()"]').disabled,'unlocked destination can dispatch');fit();d.querySelector('[data-destination-prev]').click();assert(run('selectedDungeon')===firstDestination,'arrow switches back');
 run("dungeonProgress.forest=0;selectedDungeon='camp';render()");assert(run('selectedDungeon')==='forest'&&d.querySelectorAll('.destination-card').length===1&&!d.querySelector('.destination-controls'),'stale locked selection falls back');
 const state=run('JSON.stringify({gold,day,parties,stock,supplies})');for(const n of [1,2,0]){d.querySelector(`[data-support-party="${n}"]`).click();assert(run('party')===n&&!run('partyRosterOpen'),'switch stays on destination');assert(run('JSON.stringify({gold,day,parties,stock,supplies})')===state,'switch preserves state');assert(d.querySelectorAll('[data-support-member]').length===[2,1,0][n],'no empty slots');assert(Math.abs(d.querySelector('.expedition-party').getBoundingClientRect().height-partyHeight)<1&&Math.abs(d.querySelector('.destination-panel').getBoundingClientRect().top-destinationTop)<1,'empty and populated party heights match');if(n===1)assert(Math.abs(d.querySelector('[data-support-member]').getBoundingClientRect().width-(row.width-16)/3)<2,'one member retains third width');fit()}
 d.querySelector('[data-support-member="kyle"]').click();assert(run('screen')==='equipment','portrait opens gear');run('closeCharacterEquipment()');assert(run('party')===0,'gear returns to same party');run('depart()');assert(run('expeditions[0].members.length')===1&&run('expeditions[0].members[0]')==='kyle','recovering member not dispatched');assert(d.querySelector('[data-companion-status="away"]'),'away visible');d.querySelector('[data-support-party="1"]').click();assert(d.querySelector('[data-companion-status="waiting"]'),'other party ready');run('depart()');assert(run('expeditions.length')===2,'dispatch another party directly');run('economyState.companions.gares={dead:true};render()');assert(d.querySelector('[data-companion-status="dead"]'),'death visible');assert(w.getComputedStyle(d.querySelector('[data-companion-status="dead"] .character-art')).filter==='grayscale(1)','death monochrome');run("chapter=1;selectedDungeon='velk_blockade';render()");assert(run('selectedDungeon')==='eldia_road'&&d.querySelectorAll('.destination-card').length===1&&!d.querySelector('.destination-controls'),'chapter one filters unavailable places');run("dungeonProgress.eldia_road=config.dungeons.find(d=>d.id==='eldia_road').requiredProgress;render()");assert(d.querySelectorAll('.destination-card').length===2,'chapter one unlocks second place');await Promise.race([Promise.all([...d.querySelectorAll('.destination-art')].map(im=>im.decode())),new Promise(resolve=>setTimeout(resolve,1500))]);assert(new Set(run('config.dungeons.map(d=>d.image)')).size===4,'four distinct backgrounds');run('moveDestination(1)');const longCard=d.querySelector('.destination-card[data-selected="true"]').getBoundingClientRect(),longGlass=d.querySelector('.destination-card[data-selected="true"] .destination-glass').getBoundingClientRect();assert(longGlass.top>=longCard.top&&longGlass.bottom<=longCard.bottom,'narrow panel contains long destination name');if(q.has('preview'))run(setup);document.querySelector('#status').textContent=`PASS ${width}x${height} direct party switch, larger faces, recovery/away/death states, no empty slots, gear return, dispatch excludes recovering`;
}catch(e){document.querySelector('#status').textContent='FAIL '+e.stack}finally{if(saved===null)localStorage.removeItem('shop-game-save');else localStorage.setItem('shop-game-save',saved)}};
</script>
