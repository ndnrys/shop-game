<!doctype html><meta charset="utf-8"><title>操作性の確認</title><pre id="status">RUNNING</pre><iframe src="../index.html"></iframe><script>
const q=new URLSearchParams(location.search),width=+(q.get('width')||360),height=+(q.get('height')||640),frame=document.querySelector('iframe'),saved=localStorage.getItem('shop-game-save');
frame.style=`width:${width}px;height:${height}px;border:0`;if(q.has('preview')){document.body.style.margin=0;document.querySelector('#status').style.display='none'}
frame.onload=async()=>{const w=frame.contentWindow,d=frame.contentDocument,run=s=>w.eval(s),wait=n=>new Promise(r=>setTimeout(r,n)),assert=(v,m)=>{if(!v)throw Error(m)},fit=()=>{const v=d.querySelector('#view');assert(v.scrollHeight<=v.clientHeight+1,'screen overflow '+v.scrollHeight+'/'+v.clientHeight+' '+[...v.children].map(e=>e.className+':'+e.getBoundingClientRect().height).join(','))};try{
 while(!d.querySelector('#date').textContent)await wait(20);
 run(`saveReady=false;reset(false);language=${JSON.stringify(q.get('lang')||'ja')};warehouseSize={width:8,height:8};stock=[];pending=[];shelf=[];for(const id of ['one_hand_sword_01','shield_01','body_light_01','head_light_11'])storeItem(newItem(id));phase=3;go('home')`);
 for(const [ids,kind] of [[['one_hand_sword_01','shield_01'],'set'],[['one_hand_sword_01','one_hand_sword_03'],'slot'],[['one_hand_sword_01','one_hand_sword_01'],'identical']]){run(`shelf=${JSON.stringify(ids)}.map(id=>({...newItem(id),shelfId:0}));render()`);const effect=d.querySelector('[data-shelf-effect="'+kind+'"]');assert(effect,'active '+kind+' effect');assert(d.querySelectorAll('[data-shelf-effect]').length===1,'effect priority '+kind);effect.click();assert(d.querySelector('#modal').open,'effect explanation');d.querySelector('#modal button').click();assert(!d.querySelector('#modal').open,'effect close button closes its own dialog')}
 run(`shelf=[{...newItem('one_hand_sword_01'),shelfId:0},{...newItem('shield_01'),shelfId:1}];render()`);assert(!d.querySelector('[data-shelf-effect]'),'sets do not cross shelves');run('shelf=[];render()');
 assert(!d.querySelector('.stocking-hint,#view>.bottom'),'no redundant stocking hint or next button');assert(d.querySelectorAll('.day-actions button').length===2,'stocking day actions');d.querySelector('.day-actions .report-action').click();assert(run('screen')==='dailyReport','report button opens report');run('go("home")');
 for(let n=0;n<=4;n++){run(`shelf=Array.from({length:${n}},()=>({...newItem('one_hand_sword_01'),shelfId:1}));render()`);const b=d.querySelector('[data-shelf-index="1"]');assert(Number(b.dataset.filled)===n&&b.querySelectorAll('img').length===n,'shelf occupancy '+n);assert(Number(b.dataset.shelfTotal)===run('shelf.reduce((sum,item)=>sum+saleValue(item),0)'),'shelf total '+n);b.click();assert(run('selectedShelf')===1,'shelf button switches');d.querySelector('[data-shelf-index="0"]').click()}
 run('shelf=[];render()');const initialCount=run('economyState.shelfCount');run('economyState.shelfCount=6;render()');let strip=d.querySelector('.shelf-switcher');assert(strip.querySelectorAll('.shelf-switch').length===6&&strip.scrollWidth>strip.clientWidth,'six shelves scroll horizontally');assert(Math.abs(strip.querySelector('.shelf-switch').getBoundingClientRect().width-(strip.clientWidth-18)/4)<2,'quarter width shelves');strip.scrollLeft=strip.scrollWidth;const offset=strip.scrollLeft;d.querySelector('[data-shelf-index="5"]').click();assert(run('selectedShelf')===5&&d.querySelector('.shelf-switcher').scrollLeft>=offset-2,'scroll retained on shelf choice');run('economyState.shelfCount='+initialCount+';selectShopShelf(0)');assert(d.querySelector('.shop-product-stats')?.textContent&&d.querySelector('.shop-product-price')?.textContent.includes('G'),'stock performance and price');
 assert(d.querySelectorAll('.shop-stock-section .shop-product-card').length===4,'four stock items per page');const shelfList=d.querySelector('.shop-shelf-section .shop-product-list').getBoundingClientRect();assert(shelfList.bottom<=d.querySelector('.shop-shelf-section').getBoundingClientRect().bottom,'shelf slots stay inside panel');assert(!d.querySelector('.shop-product-transfer,.shop-product-detail,[onclick*="shopProductInfo"]'),'no detail actions');assert([...d.querySelectorAll('.stocking-transfers button')].every(b=>b.disabled),'actions disabled without selection');
 for(const card of d.querySelectorAll('.shop-stock-section .shop-product-card'))assert(card.getBoundingClientRect().height>=44,'item selection touch height');const before=run('stock.length');d.querySelector('.shop-stock-section .shop-product-card').click();
 assert(run('stock.length')===before,'selection does not transfer');
 let controls=[...d.querySelectorAll('.stocking-transfers button')];assert(controls.length===2&&!controls[0].disabled&&controls[1].disabled,'persistent actions reflect stock selection');
 for(const b of controls)assert(b.getBoundingClientRect().height>=44,'stock action touch height');
 controls[0].click();assert(run('shelf.length')===1&&run('stock.length')===before-1,'selected item moves to shelf');
 d.querySelector('.shop-shelf-section .shop-product-card').click();d.querySelectorAll('.stocking-transfers button')[1].click();assert(run('shelf.length')===0&&run('stock.length')===before,'return to warehouse');
 d.querySelectorAll('.shop-stock-section .shop-product-card')[0].click();d.querySelectorAll('.shop-stock-section .shop-product-card')[1].click();
 assert(d.querySelectorAll('.stocking-transfers button').length===2,'persistent batch actions');d.querySelector('.stocking-transfers button').click();assert(run('shelf.length')===2,'batch transfer');fit();
 run(`pending=[newItem('shield_01')];warehouseShowStock=false;phase=2;go('home')`);fit();
 const board=d.querySelector('.real-board').getBoundingClientRect(),panel=d.querySelector('.warehouse-item-panel').getBoundingClientRect(),last=d.querySelector('.warehouse-axis-y span:last-child').getBoundingClientRect();
 assert(board.width>=150,'usable warehouse board');assert(last.bottom<=panel.top,'all eight row labels visible');
 assert(!d.querySelector('.warehouse-footer,#warehouseBlocked'),'warehouse footer removed');const service=d.querySelector('.warehouse-expand').getBoundingClientRect();assert(service.bottom<=board.top,'carpenter above grid');assert(service.right<=d.querySelector('#view').getBoundingClientRect().right,'carpenter right aligned');assert(board.width>=200,'expanded grid');
 assert(!d.querySelector('.warehouse-tabs'),'warehouse mode tabs removed');assert(d.querySelectorAll('.warehouse-item-panel').length===1,'one shared item panel');assert(![...d.querySelectorAll('#view button')].some(b=>b.textContent.includes('破棄')),'discard removed');
 run(`pending=[newItem('shield_01'),newItem('accessory_01')];warehouseShowStock=false;render();globalThis.incomingSecond=pending[1].uid`);
 assert(!d.querySelector('.warehouse-incoming-list'),'item strip removed');assert(d.querySelector('.warehouse-purchase-tag'),'delivery tag inside common panel');d.querySelector('.day-actions .primary').click();assert(d.querySelector('#confirmUnsortedDialog').open,'opening with incoming items asks for confirmation');d.querySelector('#confirmUnsortedDialog').close();d.querySelector('.warehouse-purchase-tag').click();assert(run('incomingWarehouseItem().uid')===run('incomingSecond'),'select second delivery');assert(d.querySelector('.warehouse-sell-price strong').textContent===run('money(saleValue(incomingWarehouseItem()))'),'delivery sale price');assert(d.querySelector('.warehouse-selected-item b').textContent===run('itemName(incomingWarehouseItem())'),'shared panel shows delivery');
 const rotation=run('stock[0].rotation');run('warehouseCell(stock[0].x,stock[0].y)');assert(run('warehouseShowStock')&&run('stock[0].rotation')===rotation,'select stored item without unintended rotation');assert(d.querySelector('.warehouse-selected-item b').textContent===run('itemName(incomingWarehouseItem())'),'incoming details stay visible while selecting stock');run('warehouseCell(stock[0].x,stock[0].y)');assert(run('stock[0].rotation')!==rotation,'stock still rotates with deliveries pending');assert(d.querySelector('.warehouse-selected-item b').textContent===run('itemName(incomingWarehouseItem())'),'incoming details stay visible while rotating stock');
 run('selectIncomingWarehouseItem(incomingSecond);receive()');assert(run('stock.some(i=>i.uid===incomingSecond)&&pending.length===1'),'receive selected delivery');run('buybackIncoming()');assert(run('pending.length')===0,'buyback selected delivery');assert(!d.querySelector('.warehouse-purchase-tag')&&d.querySelector('.warehouse-selected-item b').textContent===run('itemName(stock[selected])'),'stock details shown only after deliveries cleared');assert(d.querySelector('.warehouse-sell-price strong').textContent===run('money(saleValue(stock[selected]))'),'stored item sale price');const afterBoard=d.querySelector('.real-board').getBoundingClientRect();assert(Math.abs(afterBoard.top-board.top)<1&&Math.abs(afterBoard.width-board.width)<1&&Math.abs(afterBoard.height-board.height)<1,'stable grid with or without deliveries');assert(!d.querySelector('.warehouse-incoming-list'),'no item strip after receiving');assert(d.querySelectorAll('.day-actions button').length===2,'warehouse day actions');
 assert(d.querySelector('.preparation-nav [aria-current="page"]'),'preparation current state');d.querySelector('.warehouse-expand').click();assert(run('screen')==='residents'&&run('sub')===1,'carpenter opens');
 run(`pending=[];phase=4;openCharacterEquipment(availableCharacterIds[0])`);fit();
 assert(d.querySelector('.equipment-character-backdrop'),'character artwork retained');
 assert(w.getComputedStyle(d.querySelector('.character-stats')).backgroundColor!=='rgba(255, 249, 235, 0.467)','opaque stats backing');
 run(`selectCharacterPanel('growth')`);fit();
 run(`settingsTab=1;go('settings')`);fit();assert(!d.querySelector('.build-status button'),'reset removed from header');run('confirmResetGame()');assert(d.querySelector('#confirmResetDialog').open,'reset confirmation');d.querySelector('#confirmResetDialog').close();
 if(q.has('preview'))run(`phase=3;go('home');shopToggleSelection('stock',stock[0].uid)`);
 document.querySelector('#status').textContent=`PASS ${width}x${height} ${q.get('lang')||'ja'} persistent actions, shelf totals, six-shelf swipe, transfers, batch, warehouse labels, carpenter above grid, equipment, growth, reset confirmation`;
}catch(e){document.querySelector('#status').textContent='FAIL '+e.stack}finally{if(saved===null)localStorage.removeItem('shop-game-save');else localStorage.setItem('shop-game-save',saved)}};
</script>
