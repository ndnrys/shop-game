<!doctype html><meta charset="utf-8"><title>道具屋UIの表示検証</title>
<style>body{margin:0;background:#e4dac8;font:12px sans-serif}iframe{display:block;border:0;margin:auto}#status{white-space:pre-wrap;margin:0}body.preview #status{display:none}</style>
<pre id="status">RUNNING</pre><iframe src="../index.html"></iframe>
<script>
const q=new URLSearchParams(location.search),width=+(q.get('width')||390),height=+(q.get('height')||844),frame=document.querySelector('iframe');frame.style=`width:${width}px;height:${height}px`;
const original=localStorage.getItem('shop-game-save'),checks=[];
frame.onload=async()=>{const w=frame.contentWindow,d=frame.contentDocument,run=code=>w.eval(code),wait=ms=>new Promise(r=>setTimeout(r,ms));try{
 while(!d.querySelector('#date').textContent)await wait(20);
 run('reset();saveReady=false');
 const seed=()=>run(`warehouseSize={width:8,height:8};stock=[];shelf=[];pending=[];uid=0;for(const id of ['one_hand_sword_01','shield_01','body_light_01','head_light_11','one_hand_sword_03','accessory_01']){const item=newItem(id);storeItem(item);EncyclopediaCore.acquire(encyclopedia,id)};render()`);
 if(q.get('filled'))seed();
 const cases={report:'phase=0;go("home")',purchase:'phase=1;go("home")',warehouse:'phase=2;go("home")',stocking:'phase=3;go("home")',destination:'phase=4;go("home")',formation:'phase=4;go("adventurers");partyRosterOpen=true;render()',equipment:'openCharacterEquipment(availableCharacterIds[0])',encyclopedia:'openEncyclopedia()',sales:'phase=5;go("home")',records:'go("records")',settings:'go("settings")',save:'settingsTab=1;go("settings")',data:'settingsTab=2;go("settings")',support:'phase=4;go("home");assistanceOpen=true;render()',residents:'assistanceOpen=false;go("residents")',carpenter:'sub=1;render()',catalog:'openCatalog("settings")',donation:'go("donation")',journal:'go("journal")'};
 const selected=q.get('screen'),names=selected?[selected]:Object.keys(cases);
 for(const name of names){run('assistanceOpen=false');run(cases[name]);await wait(150);await Promise.race([Promise.all([...d.querySelectorAll('#view img')].map(im=>im.decode().catch(()=>{}))),wait(250)]);const view=d.querySelector('#view'),nav=d.querySelector('#nav');if(view.scrollHeight>view.clientHeight+1)throw Error(name+' overflow '+view.scrollHeight+'/'+view.clientHeight);if(d.documentElement.scrollWidth>width)throw Error(name+' horizontal overflow');if(nav.getBoundingClientRect().bottom>height+1)throw Error(name+' navigation offscreen');const speech=d.querySelector('.report-clerk-speech');if(speech&&[...speech.children].some(el=>el.getBoundingClientRect().bottom>speech.getBoundingClientRect().bottom+1))throw Error(name+' speech overflow');if(!d.querySelector('h1'))throw Error(name+' missing title');checks.push(name)}
 if(!selected){seed();for(const name of ['warehouse','stocking','equipment','encyclopedia']){run('assistanceOpen=false');run(cases[name]);await wait(150);await Promise.race([Promise.all([...d.querySelectorAll('#view img')].map(im=>im.decode().catch(()=>{}))),wait(250)]);const view=d.querySelector('#view');if(view.scrollHeight>view.clientHeight+1)throw Error('filled '+name+' overflow');checks.push('filled '+name)}run('toggleMenu()');if(!d.querySelector('#nav').classList.contains('is-open'))throw Error('menu did not open');d.querySelector('.nav-more button').click();if(run('screen')!=='settings')throw Error('settings navigation');checks.push('menu');}
 document.querySelector('#status').textContent='PASS '+width+'x'+height+' '+checks.join(', ');
 if(selected)document.body.classList.add('preview');
}catch(e){document.querySelector('#status').textContent='FAIL '+e.stack}finally{if(original===null)localStorage.removeItem('shop-game-save');else localStorage.setItem('shop-game-save',original)}};
</script>
