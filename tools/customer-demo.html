<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>購入客画像プレビュー</title><link rel="stylesheet" href="../css/game.css?v=customer-images-1"><style>body{overflow:auto}.preview{max-width:500px;margin:20px auto;padding:16px}.preview h1,.preview p{margin-bottom:12px}.preview .sales-visit{margin-bottom:8px}</style><section class="preview"><h1>購入客画像プレビュー</h1><p>営業画面と同じ住人画像です。進行データは変更しません。</p><div id="customers"></div><a href="../">ゲームに戻る</a></section><script>
fetch('../data/trading.json').then(r=>r.json()).then(data=>{for(const c of data.customers){const row=document.createElement('div');row.className='sales-visit';const icon=document.createElement('span');icon.className='sales-character';const img=document.createElement('img');img.src='../'+c.image;img.alt=c.name;icon.append(img);const text=document.createElement('div');text.className='sales-visit-text';const name=document.createElement('b');name.textContent=c.name;const speech=document.createElement('small');speech.textContent='「いい買い物ができた！」';text.append(name,speech);row.append(icon,text);document.querySelector('#customers').append(row)}}).catch(()=>{document.querySelector('#customers').textContent='画像設定を読み込めませんでした。'});
</script></html>
