<!doctype html><html lang="ja"><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仕入れ演出デモ</title><link rel="stylesheet" href="css/game.css?v=warm-shop-24"><style>body{min-height:100dvh;display:grid;place-items:center;margin:0}.demo{padding:24px;max-width:440px;text-align:center}.demo button{min-height:48px;margin:8px}</style><main class="demo"><h1>仕入れ演出デモ</h1><p>店内で受け渡し → 品物の確認 → 入荷カード</p><button id="replay">再生</button><p id="status" role="status">準備中…</p></main><script src="js/effects.js?v=warm-shop-24"></script><script>
let items=[];const status=document.querySelector('#status');
for(const b of document.querySelectorAll('button'))b.disabled=true;
fetch('data/item-catalog.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(c=>{items=c.items.filter(d=>d.status==='active'&&d.image).slice(0,6).map(d=>({name:d.name,image:d.image}));for(const b of document.querySelectorAll('button'))b.disabled=false;status.textContent='セーブデータは変更しません。';GameEffects.play('purchase',{items,merchants:[0]})}).catch(()=>{status.textContent='商品データの読み込みに失敗しました。HTTPサーバーから開いてください。'});
document.querySelector('#replay').onclick=()=>GameEffects.play('purchase',{items,merchants:[0]});
</script></html>
